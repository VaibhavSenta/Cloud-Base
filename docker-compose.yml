version: '3.8'

services:
  # --- ACCOUNT MODULE ---
  account-api:
    build:
      context: .
      dockerfile: ./services/account-api/Dockerfile
    ports:
      - "5010:5010"
    volumes:
      - .:/app
      - /app/services/account-api/node_modules
    networks:
      - cloudbase-net

  account-portal:
    build:
      context: .
      dockerfile: ./apps/account-portal/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/apps/account-portal/node_modules
      - /app/apps/account-portal/.next
    networks:
      - cloudbase-net

  # --- USER MODULE ---
  user-portal:
    build:
      context: .
      dockerfile: ./apps/user-portal/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/apps/user-portal/node_modules
      - /app/apps/user-portal/.next
    networks:
      - cloudbase-net

  # --- ADMIN MODULE ---
  admin-api:
    build:
      context: .
      dockerfile: ./services/admin-api/Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - /app/services/admin-api/node_modules
    networks:
      - cloudbase-net

  admin-portal:
    build:
      context: .
      dockerfile: ./apps/admin-portal/Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - /app/apps/admin-portal/node_modules
      - /app/apps/admin-portal/.next
    networks:
      - cloudbase-net

  # --- CHAT MODULE ---
  chat-api:
    build:
      context: .
      dockerfile: ./services/chat-api/Dockerfile
    ports:
      - "5006:5006"
    volumes:
      - .:/app
      - /app/services/chat-api/node_modules
    networks:
      - cloudbase-net

  chat-portal:
    build:
      context: .
      dockerfile: ./apps/chat-portal/Dockerfile
    command: npm run dev -- --hostname 0.0.0.0 # Force development hot reloading on host interfaces
    ports:
      - "3003:3001"
    volumes:
      - .:/app
      - /app/apps/chat-portal/node_modules
      - /app/apps/chat-portal/.next
    networks:
      - cloudbase-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-portal
      - account-portal
      - admin-portal
      - chat-portal
      - chat-api
    networks:
      - cloudbase-net

networks:
  cloudbase-net:
    driver: bridge