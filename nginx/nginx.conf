events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Docker internal DNS resolver — dynamically updates IP addresses every 5s on container restart
    resolver 127.0.0.11 valid=5s;

    # Gzip Compression for Performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- USER PORTAL (Main landing & default fallback) ---
    server {
        listen 80 default_server;
        server_name localhost cloudbase.local cloud-base.dev www.cloud-base.dev;

        location / {
            set $user_portal_upstream "http://user-portal:3000";
            proxy_pass $user_portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- CHAT PORTAL ---
    server {
        listen 80;
        server_name chat.localhost chat.cloudbase.local chat.cloud-base.dev;

        location /socket.io/ {
            set $chat_api_upstream "http://chat-api:5006";
            proxy_pass $chat_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $chat_portal_upstream "http://chat-portal:3001";
            proxy_pass $chat_portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- ACCOUNT PORTAL ---
    server {
        listen 80;
        server_name account.localhost account.cloudbase.local account.cloud-base.dev;

        location / {
            set $account_portal_upstream "http://account-portal:3001";
            proxy_pass $account_portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- ADMIN PORTAL ---
    server {
        listen 80;
        server_name admin.localhost admin.cloudbase.local admin.cloud-base.dev;

        location / {
            set $admin_portal_upstream "http://admin-portal:3002";
            proxy_pass $admin_portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
